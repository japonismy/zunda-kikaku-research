name: Publish research site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Assemble public files
        run: |
          mkdir -p _site/data
          cp index.html .nojekyll _site/
          cp data/channels.js data/videos.js data/transcripts_light.js data/pipeline_status.js _site/data/
          if [ -d assets/thumbnails ]; then mkdir -p _site/assets; cp -R assets/thumbnails _site/assets/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Remove the temporary deployment artifact
        if: steps.deployment.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id')
          if [ -n "$artifact_id" ]; then gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"; fi
